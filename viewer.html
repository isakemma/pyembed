<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Snippet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; }
    body { display: flex; flex-direction: column; }
    /* !important: the widget adds its own "psw" class to this same element,
       and embed.js's `.psw { all: initial; ... }` reset otherwise wins the
       equal-specificity tie (it's injected after this stylesheet), silently
       dropping flex: 1 and letting the widget grow to its content's height
       instead of filling the iframe — which breaks internal scrolling. */
    .py-snippet { flex: 1 !important; min-height: 0 !important; }
    /* Let the widget fill the iframe */
    .psw .pw-widget { height: 100% !important; border-radius: 0 !important; border: none !important; }
  </style>
</head>
<body>
  <div class="py-snippet" id="widget"></div>
  <script src="site.js"></script>
  <script src="embed.js"></script>
  <script>
    // Which snippet the link is about is worked out in site.js, for links
    // of every kind: ?folder/name, and ?src=folder/03.json from before names.
    const el = document.getElementById('widget');
    function say(text) {
      el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#cf222e;font-size:13px;';
      el.textContent = text;
    }
    const raw = PySnippets.addressFromQuery(location.search);
    if (raw) {
      PySnippets.resolve(raw).then(found => {
        if (found.retired) { say('⚠ This example has been removed.'); return; }
        el.dataset.src = found.src;
        window._pySnippetInitAll();
      });
    } else {
      say('⚠ No snippet specified. Add ?basic-examples/hello to the URL.');
    }
  </script>
</body>
</html>
